services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geofence_db
    environment:
      POSTGRES_USER: geofence
      POSTGRES_PASSWORD: geofence_pass
      POSTGRES_DB: geofence_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: geofence-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://geofence:geofence_pass@db:5432/geofence_db?sslmode=disable
      PORT: "8080"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
